name = "stomiko-api"
# Аккаунт задан явно. Без него wrangler берёт тот, к которому у токена есть
# доступ прямо сейчас, — и когда сессия потеряла доступ к аккаунту Alrevion,
# выкладка молча ушла на личный аккаунт и создала там второй stomiko-api.
# Команда отвечала «Deployed», приложение на alrevion.workers.dev не менялось,
# и заметить это можно было только сверив байты выложенного файла.
account_id = "ef15164ffdf3e190778b8f59cd37cf67"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../miniapp/public"
binding = "ASSETS"
# not_found_handling НЕ ставим: при "single-page-application" все несовпавшие
# пути отдают index.html, НЕ доходя до воркера, и /api/* вернул бы HTML.
# По умолчанию несовпавшее уходит в воркер, где его ловит catch-all.

# Секреты (wrangler secret put ...): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN

# Напоминания. Каждые 15 минут: окно поиска ±30 минут вокруг цели, поэтому
# опоздание планировщика не приводит к пропущенному напоминанию.
[triggers]
crons = ["*/15 * * * *"]
