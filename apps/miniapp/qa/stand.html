<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stomiko — стенд обхода</title>
<script>
// Подставная обёртка Telegram. Подпись настоящая — её проверяет боевой код,
// поэтому экраны идут на живом API, а не на выдуманных ответах.
(function () {
  const q = new URLSearchParams(location.search);
  // URLSearchParams декодирует сам. Второй decodeURIComponent превращал
  // %D0%9A обратно в кириллицу, и заголовок с ней уже не собирался.
  const initData = q.get('d') || '';
  const user = JSON.parse(new URLSearchParams(initData).get('user') || '{}');
  // Высота видимой части листа: ровно так её сообщает Telegram на iOS.
  document.documentElement.style.setProperty('--tg-viewport-stable-height', (q.get('h') || 640) + 'px');
  const noop = () => {};
  window.Telegram = { WebApp: {
    initData, initDataUnsafe: { user, start_param: new URLSearchParams(initData).get('start_param') || undefined },
    themeParams: {}, ready: noop, expand: noop, close: () => console.log('[tg] close'),
    onEvent: noop, offEvent: noop,
    BackButton: { show: () => document.body.dataset.back = 'on', hide: () => document.body.dataset.back = 'off', onClick(f){ window.__back = f; } },
    HapticFeedback: { impactOccurred: noop, notificationOccurred: noop },
    openTelegramLink: (u) => console.log('[tg] openTelegramLink', u),
    requestContact: (cb) => { console.log('[tg] requestContact'); cb && cb(false); },
  } };
})();
</script>
<script src="/_qa-audit.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="root"><div class="loading">Загрузка…</div></div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js" type="module"></script>
</body></html>
